name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobansky/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Build Archive
      run: |
        xcodebuild -project YTDownloader.xcodeproj \
          -scheme YTDownloader \
          -sdk iphoneos \
          -configuration Release \
          -archivePath $PWD/build/YTDownloader.xcarchive \
          archive \
          CODE_SIGNING_ALLOWED=NO

    - name: Create Unsigned IPA
      run: |
        cd build
        mkdir -p Payload
        cp -r YTDownloader.xcarchive/Products/Applications/YTDownloader.app Payload/
        zip -r YTDownloader.ipa Payload
        mv YTDownloader.ipa ../YTDownloader.ipa

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: YTDownloader-iOS-IPA
        path: YTDownloader.ipa
