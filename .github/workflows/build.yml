name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Show Xcode Version
      run: xcodebuild -version

    - name: Build Unsigned Archive
      run: |
        xcodebuild -project YTDownloader.xcodeproj \
          -scheme YTDownloader \
          -configuration Release \
          -sdk iphoneos \
          -archivePath $PWD/build/YTDownloader.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          archive

    - name: Package IPA
      run: |
        cd build
        mkdir -p Payload
        cp -r YTDownloader.xcarchive/Products/Applications/YTDownloader.app Payload/
        zip -r -y YTDownloader.ipa Payload
        mv YTDownloader.ipa ../YTDownloader.ipa

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: YTDownloader-iOS-IPA
        path: YTDownloader.ipa
        if-no-files-found: error
